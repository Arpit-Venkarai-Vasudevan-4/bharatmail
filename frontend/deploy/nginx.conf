map $uri $phonemail_cache_control {
  default "no-cache";
  ~^/assets/ "public, max-age=31536000, immutable";
  ~^/api/ "no-store";
  /portal.html "no-store";
}
server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 16m;
  add_header X-Content-Type-Options nosniff always;
  add_header Cache-Control $phonemail_cache_control always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  location /api/ {
    proxy_pass ${API_PROXY_TARGET};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }
  location = /portal { return 302 /portal.html; }
  location = /portal.html { try_files $uri =404; }
  location /assets/ {
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/css image/svg+xml;
    try_files $uri =404;
  }
  location = /sw.js { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
